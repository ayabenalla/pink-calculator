<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة متطورة وذكية 🎀🎙️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ebd9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .calculator {
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(147, 51, 234, 0.15);
            width: 340px;
            padding: 25px;
            z-index: 10;
            position: relative;
            border: 3px solid #f472b6;
        }

        .lang-select {
            width: 100%;
            padding: 8px;
            border-radius: 15px;
            border: 2px solid #f472b6;
            background: #fcf7ff;
            color: #ec4899;
            font-weight: bold;
            margin-bottom: 10px;
            outline: none;
            text-align: center;
            font-family: inherit;
        }

        #display {
            background: #fcf7ff;
            border: 2px solid #f472b6;
            border-radius: 20px;
            color: #000000;
            font-size: 2.2rem;
            text-align: right;
            padding: 15px;
            margin-bottom: 5px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            font-weight: bold;
            direction: ltr;
        }

        .status-bar {
            font-size: 0.85rem;
            color: #ec4899;
            text-align: center;
            height: 20px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border-radius: 50%;
            font-size: 1.3rem;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border: none;
        }

        button:active {
            transform: scale(0.92);
        }

        .btn-num {
            background: #ffffff;
            color: #000000;
            border: 2px solid #e5e7eb;
            font-weight: bold;
        }

        .btn-num:hover {
            background: #f9fafb;
        }

        .btn-op {
            background: #ffffff;
            color: #ec4899;
            border: 2px solid #f472b6;
            font-weight: bold;
        }

        .btn-op:hover {
            background: #fdf2f8;
        }

        .btn-voice {
            background: #f472b6;
            color: #ffffff;
            border: 2px solid #ec4899;
            font-weight: bold;
        }

        .btn-voice.listening {
            background: #ef4444;
            border-color: #dc2626;
            animation: blink 0.8s infinite;
        }

        .btn-eq {
            background: #ec4899;
            color: #ffffff;
            border: 2px solid #ec4899;
            grid-column: span 2;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.6rem;
        }

        .btn-eq:hover {
            background: #db2777;
        }

        .btn-clear {
            background: #ffffff;
            color: #ec4899;
            border: 2px solid #f472b6;
            font-weight: bold;
        }

        .emoji-shower {
            position: fixed;
            font-size: 1.8rem;
            animation: fallDown 2.5s ease-in-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes fallDown {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            80% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) scale(1.1) rotate(270deg);
            }
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- اختيار اللغات بما فيها الكورية والصينية -->
        <select id="langSelect" class="lang-select">
            <option value="ar-MA">العربية / الدارجة 🇲🇦</option>
            <option value="fr-FR">Français 🇫🇷</option>
            <option value="en-US">English 🇺🇸</option>
            <option value="es-ES">Español 🇪🇸</option>
            <option value="ko-KR">한국어 (كورية) 🇰🇷</option>
            <option value="zh-CN">中文 (صينية) 🇨🇳</option>
        </select>

        <input type="text" id="display" readonly placeholder="0">
        <div class="status-bar" id="status">كلكي على 🎙️ وتكلم(ي)</div>

        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">AC</button>
            <button class="btn-op" onclick="deleteLast()">⌫</button>
            <button class="btn-voice" id="voiceBtn" onclick="startVoice(event)">🎙️</button>
            <button class="btn-op" onclick="appendToDisplay('/', event)">÷</button>

            <button class="btn-op" onclick="calcSquareRoot(event)">√</button>
            <button class="btn-op" onclick="calcSquare(event)">x²</button>
            <button class="btn-op" onclick="appendToDisplay('*', event)">×</button>
            <button class="btn-op" onclick="appendToDisplay('-', event)">-</button>

            <button class="btn-num" onclick="appendToDisplay('7', event)">7</button>
            <button class="btn-num" onclick="appendToDisplay('8', event)">8</button>
            <button class="btn-num" onclick="appendToDisplay('9', event)">9</button>
            <button class="btn-op" onclick="appendToDisplay('+', event)">+</button>

            <button class="btn-num" onclick="appendToDisplay('4', event)">4</button>
            <button class="btn-num" onclick="appendToDisplay('5', event)">5</button>
            <button class="btn-num" onclick="appendToDisplay('6', event)">6</button>
            <button class="btn-op" onclick="appendToDisplay('.', event)">.</button>

            <button class="btn-num" onclick="appendToDisplay('1', event)">1</button>
            <button class="btn-num" onclick="appendToDisplay('2', event)">2</button>
            <button class="btn-num" onclick="appendToDisplay('3', event)">3</button>
            <button class="btn-num" onclick="appendToDisplay('0', event)">0</button>

            <button class="btn-eq" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let statusText = document.getElementById('status');
        let voiceBtn = document.getElementById('voiceBtn');
        let langSelect = document.getElementById('langSelect');

        const customEmojis = ['🎀', '🌸', '🩷', '🦋', '🧸', '✨', '🍒', '🍓', '🍉', '🎈'];
        let currentEmojiIndex = 0;

        function appendToDisplay(value, event) {
            display.value += value;
            if (event) dropNextEmoji(event);
        }

        function clearDisplay() {
            display.value = '';
            statusText.innerText = 'كلكي على 🎙️ وتكلم(ي)';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calcSquareRoot(event) {
            try {
                if (display.value) {
                    display.value = Math.sqrt(eval(display.value.replace(/%/g, '/100')));
                    if (event) dropNextEmoji(event);
                }
            } catch (e) {
                display.value = 'Error';
            }
        }

        function calcSquare(event) {
            try {
                if (display.value) {
                    display.value = Math.pow(eval(display.value.replace(/%/g, '/100')), 2);
                    if (event) dropNextEmoji(event);
                }
            } catch (e) {
                display.value = 'Error';
            }
        }

        function calculate() {
            try {
                let expression = display.value.replace(/%/g, '/100');
                display.value = eval(expression);
            } catch (e) {
                display.value = 'Error';
            }
        }

        // تأثير تساقط الإيموجيات
        function dropNextEmoji(event) {
            if (!event || !event.target) return;
            const emoji = document.createElement('div');
            emoji.className = 'emoji-shower';
            emoji.innerText = customEmojis[currentEmojiIndex];
            
            currentEmojiIndex = (currentEmojiIndex + 1) % customEmojis.length;

            const rect = event.target.getBoundingClientRect();
            emoji.style.left = (rect.left + rect.width / 2 - 10) + 'px';
            emoji.style.top = rect.top + 'px';

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 2500);
        }

        // خاصية التعرف على الصوت بمختلف اللغات
        function startVoice(event) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("المتصفح ديالك مكدعمش خاصية الصوت، جرب(ي) Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = langSelect.value;
            recognition.interimResults = false;

            recognition.onstart = function() {
                voiceBtn.classList.add('listening');
                statusText.innerText = 'جاري الاستماع... 🎧';
            };

            recognition.onspeechend = function() {
                voiceBtn.classList.remove('listening');
                recognition.stop();
            };

            recognition.onresult = function(e) {
                let text = e.results[0][0].transcript.toLowerCase();
                statusText.innerText = 'سمعت: "' + text + '"';
                
                // ترجمة العمليات من مختلف اللغات (عربية، فرنسية، إنجليزية، كورية، صينية)
                text = text.replace(/زائد|بلس|plus|더하기|加|\+/g, '+')
                           .replace(/ناقص|ماينس|moins|minus|빼기|减|-/g, '-')
                           .replace(/في|ضروب|ضرب|times|fois|곱하기|乘|\*/g, '*')
                           .replace(/مقسوم على|قسمة|divisé par|divided by|나누기|除|\//g, '/')
                           .replace(/يساوي|égal|equals|ن티|等于|=/g, '');

                // قاموس تحويل الكلمات المنطوقة لأرقام (بجميع اللغات)
                const numberMap = {
                    // العربية والدارجة
                    'واحد': 1, 'جوج': 2, 'تلاتة': 3, 'ثلاثة': 3, 'ربعة': 4, 'أربعة': 4, 'خمسة': 5, 'ستة': 6, 'سبعة': 7, 'تمانية': 8, 'ثمانية': 8, 'تسعود': 9, 'تسعة': 9, 'زيرو': 0, 'صفر': 0,
                    // الإنجليزية
                    'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'zero': 0,
                    // الفرنسية
                    'un': 1, 'deux': 2, 'trois': 3, 'quatre': 4, 'cinq': 5, 'six': 6, 'sept': 7, 'huit': 8, 'neuf': 9, 'zéro': 0,
                    // الكورية
                    '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9, '영': 0, '공': 0,
                    // الصينية
                    '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '零': 0
                };

                for (let word in numberMap) {
                    text = text.replace(new RegExp('\\b' + word + '\\b', 'g'), numberMap[word]);
                }

                let cleanedExpr = text.replace(/[^0-9\+\-\*\/\.]/g, '');
                if (cleanedExpr) {
                    display.value = cleanedExpr;
                    calculate();
                    dropNextEmoji(event);
                } else {
                    statusText.innerText = 'عاود(ي) جرب(ي) بصوت أوضح!';
                }
            };

            recognition.onerror = function() {
                voiceBtn.classList.remove('listening');
                statusText.innerText = 'وقع خطأ، جرب(ي) مرة اخرى';
            };

            recognition.start();
        }
    </script>
</body>
</html>
